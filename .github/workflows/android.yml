name: Android-App bauen
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: apk, cancel-in-progress: true }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: APK bauen
        env: { VCODE: '${{ github.run_number }}' }
        run: |
          export KS_PASS="$(openssl rand -hex 16)" KS_FILE="$RUNNER_TEMP/ks.jks"
          keytool -genkeypair -keystore "$KS_FILE" -storepass "$KS_PASS" -keypass "$KS_PASS" -alias calmius -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Calmius"
          gradle -p android assembleRelease --no-daemon
      - name: APK veröffentlichen
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk calmius.apk
          git config user.name "Calmius"
          git config user.email "calmius@users.noreply.github.com"
          git add calmius.apk
          git commit -m "Android-App aktualisiert" || exit 0
          git pull --rebase origin main
          git push origin main
