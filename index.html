<main id="app"></main>
<nav><div>
  <button data-v="start"><svg viewBox="0 0 24 24"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Start</button>
  <button data-v="skills"><svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="12" rx="2"/><path d="M9 7V5h6v2"/></svg>Skills</button>
  <button data-v="fuermich"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l3-4 3 2 4-6"/></svg>Für mich</button>
  <button data-v="plan"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/></svg>Notfallplan</button>
  <button data-v="profil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profil</button>
</div></nav>

<script>
/* ===== Speicher: ausschließlich lokal auf diesem Gerät ===== */
const KEY="calmius-v1"; let mem=null;
function fresh(){ return {account:null,loggedIn:false,onboarded:false,spotify:"",points:[],plan:{warn:"",skills:"",people:"",reasons:""}}; }
function load(){ try{ const r=localStorage.getItem(KEY); if(r) return Object.assign(fresh(),JSON.parse(r)); }catch(e){} return mem||fresh(); }
function save(){ mem=S; try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
let S=load();
async function hash(pw,salt){ const txt=salt+":"+pw;
  try{ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
  catch(e){ let h=5381; for(const c of txt) h=((h<<5)+h+c.charCodeAt(0))|0; return "f"+(h>>>0).toString(16); } }
function rnd(n){ const a=new Uint8Array(n); try{ crypto.getRandomValues(a); }catch(e){ for(let i=0;i<n;i++) a[i]=Math.random()*256|0; } return a; }
function randSalt(){ return [...rnd(16)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
const CODE_ABC="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function normCode(s){ return (s||"").toUpperCase().replace(/[^A-Z0-9]/g,""); }
async function newRecovery(){ let c=""; for(const b of rnd(12)) c+=CODE_ABC[b%32]; const a=S.account; a.rsalt=randSalt(); a.rhash=await hash(c,a.rsalt); cur.newCode=c.match(/.{4}/g).join("-"); }
/* ===== Freiwillige anonyme Statistik (nur nach Zustimmung, ohne Kennung) ===== */
const STATS_URL="";
const GENDERS=["weiblich","männlich","divers","keine Angabe"];
function ageGroup(a){ a=+a; return a<18?"12–17":a<=25?"18–25":a<=35?"26–35":a<=50?"36–50":a<=65?"51–65":"66+"; }
function statsSend(ev){ const a=S.account; if(!STATS_URL||!S.stats||!S.stats.on||!a||a.test||+a.age<16) return;
  const body=JSON.stringify({ev,ag:ageGroup(a.age),g:a.gender||"keine Angabe"});
  try{ fetch(STATS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body,keepalive:true}).catch(()=>{}); }catch(e){} }
function setStats(on){ S.stats=Object.assign(S.stats||{},{on,at:Date.now()}); if(on&&!S.stats.counted){ statsSend("neu"); S.stats.counted=true; } save(); if(on) statsVisit(); toast(on?"Danke! Anonyme Statistik ist an.":"Es wird nichts gesendet."); }
function statsVisit(){ if(!S.stats||!S.stats.on||!S.loggedIn) return; const k=dayKey(Date.now()); if(S.stats.day===k) return; S.stats.day=k; save(); statsSend("aufruf"); }
async function adminFetch(k){ if(!STATS_URL) return null; try{ const r=await fetch(STATS_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({admin:k})}); return await r.json(); }catch(e){ return null; } }
/* ===== Installieren (PWA) ===== */
let installEvt=null;
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); installEvt=e; });
window.addEventListener("appinstalled",()=>{ installEvt=null; if($("#install")) $("#install").remove(); toast("Calmius ist installiert"); });
const IN_APK=/CalmiusApp/.test(navigator.userAgent);
function isStandalone(){ if(IN_APK) return true; try{ return matchMedia("(display-mode: standalone)").matches||navigator.standalone===true; }catch(e){ return false; } }
async function doInstall(){
  const inFrame=/claude\.ai|claudeusercontent/.test(location.host), base=inFrame?"https://riftora-app.github.io/calmius/":"";
  infoBox("App herunterladen",`<a class="btn" href="${base}calmius.apk" download="Calmius.apk" id="apkdl">⬇️ Calmius-App herunterladen (Android)</a>
    <p><b>So geht's:</b></p><p>1. Download antippen und warten, bis er fertig ist.<br>2. Die Datei „Calmius.apk“ öffnen.<br>3. Wenn das Handy fragt: „Aus dieser Quelle zulassen“ einschalten, dann „Installieren“.</p>
    <p class="muted">Calmius erscheint danach mit eigenem Symbol auf dem Startbildschirm. Beim ersten Öffnen braucht die App einmal Internet, danach geht sie auch offline. Deine Daten bleiben nur auf dem Handy.</p>
    ${installEvt?`<button class="btn sec" id="pwainst">Ohne Download als Web-App installieren</button>`:""}`);
  const pb=document.getElementById("pwainst"); if(pb) pb.onclick=async()=>{ pb.closest(".overlay").remove(); installEvt.prompt(); try{ await installEvt.userChoice; }catch(e){} installEvt=null; }; }
function infoBox(title,html){ const o=document.createElement("div"); o.className="overlay";
  o.innerHTML=`<div class="card" role="dialog" aria-modal="true"><h2 style="margin-top:0">${title}</h2>${html}<button class="btn" id="ibok">Verstanden</button></div>`;

function catStats(tier){ const o={}; Object.keys(AREAS).forEach(k=>o[k]={n:0,sum:0,drop:0}); let L=nach(); if(tier){ const t=L.filter(p=>ctxTier(p)===tier); if(t.length>=3) L=t; } L.forEach(p=>{ const s=byId(p.id); if(!s) return; const c=o[s.area]; c.n++; c.sum+=eff(p); c.drop+=drop(p); });

function hash32(str){ let h=2166136261; for(const c of str){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function areaList(area,tier,exclude,off){
  const pool=SKILLS.filter(s=>s.area===area&&s.tier===tier&&!s.plan&&fits(s)&&!exclude.includes(s.id));
  const good=pool.filter(s=>(score(s.id,tier)||0)>0.5).sort((x,y)=>score(y.id,tier)-score(x.id,tier));
  const neu=pool.filter(s=>score(s.id,tier)==null).sort((x,y)=>hash32(x.id+off)-hash32(y.id+off));
  const bad=pool.filter(s=>{ const v=score(s.id,tier); return v!=null&&v<=0.5; });
  return [...good,...neu,...bad];
}

function suggest(tier,mode,exclude,avoid,off,trig){

  const top=ar[0], strong=top.cs.score!=null&&top.cs.score>=2;
  take(top.k,off,top.cs.score>0?`Weil dir ${AREAS[top.k].label} oft hilft`:(TRIGGERS[trig]&&TRIGGERS[trig].c.includes(top.k)?`Passt zu „${trigLabel(trig)}“`:""));
  if(strong) take(top.k,off,`Weil dir ${AREAS[top.k].label} oft hilft`); else { const b=ar[1]; take(b.k,off,b.cs.score>0?`Weil dir ${AREAS[b.k].label} oft hilft`:""); }
  const rest=ar.slice(strong?1:2); const e=rest[off%rest.length]; take(e.k,0,"Zum Ausprobieren");
  for(const a of ar){ if(out.length>=3) break; take(a.k,off,""); }
  return out.slice(0,3);
}

    for(let j=0;j<3;j++){ const hour=[9,14,20][j]+rnd()*.8; const t0=now-day*24*H-(new Date().getHours()-hour)*H; if(t0>now) continue;
      const r=rnd(), raw=base+(hour>19?1.2:0)+(rnd()*4-2), cl=(x,lo)=>Math.max(lo,Math.min(10,Math.round(x)));
      const all={a:cl(raw,1),sv:cl(raw-1.5+rnd()*2-1,0),sui:cl(raw*.35-0.8+rnd()*2-1,0)};
      const mode=all.sui>=3&&r<.5?"sui":r<.6?"a":"sv", v=all[mode], trig=trigs[Math.floor(rnd()*trigs.length)], prob=rnd()<.4?[PROBS[Math.floor(rnd()*4)]]:undefined;

      <div class="card"><h2 style="margin-top:0">Wofür Calmius gedacht ist</h2><p>Calmius ist eine Sammlung von Selbsthilfe-Übungen (Skills) für den Alltag. Die App stellt keine Diagnose, ersetzt keine Behandlung und ist kein Medizinprodukt. Wenn es dir sehr schlecht geht, sprich mit deinem Behandlungsteam. Im Notfall: 112.</p></div>
      <p class="foot">Stand: November 2026<br><button class="link small" data-go="admin">Team-Zugang</button></p>`; },
  stats(){ const a=S.account; return `<h1>Anonyme Statistik</h1><p>Darf Calmius anonym zählen, wie oft die App genutzt wird?</p>
      <div class="card"><p style="margin-top:0"><b>Gesendet wird nur:</b></p><p>• Altersgruppe: ${esc(ageGroup(a.age))}<br>• Geschlecht: ${esc(a.gender||"keine Angabe")}<br>• dass die App an einem Tag geöffnet wurde</p><p class="muted" style="margin-bottom:0">Kein Name, keine E-Mail, keine Einträge. Niemand kann sehen, dass du es bist. Du kannst das jederzeit im Profil ändern.</p></div>

  check(){ return `<h1>Worum geht es gerade?</h1>

      <p class="muted">Danach schätzt du alle drei Werte ein. Weitere Probleme wie Gedankenkreisen kannst du dort zusätzlich angeben.</p>${pflege()}`; },
  rate(){ const f=cur.focus, order=MODES[f]?[f,...Object.keys(MODES).filter(m=>m!==f)]:Object.keys(MODES), pc=probCounts();

      <div class="chips">${probs.map(t=>{ const n=(pc.find(o=>o.t.toLowerCase()===t.toLowerCase())||{}).n; return `<button class="chip ${cur.prob.some(x=>x.toLowerCase()===t.toLowerCase())?"on":""}" data-prob="${esc(t)}">${esc(t)}${n?` <span style="opacity:.6">${n}×</span>`:""}</button>`; }).join("")}</div>
      <input id="probtxt" maxlength="60" placeholder="Anderes Problem selbst eintragen" style="margin-top:10px">`;
    return `<span class="tag">${MODES[f]?MODES[f].label:"Etwas anderes"}</span><h1 style="margin-top:8px">Wie geht es dir gerade?</h1><p class="muted">Bitte alle drei Werte antippen. Es gibt kein Richtig oder Falsch.</p>

      ${order.map((m,i)=>scaleCard(m,MODES[m].label,MODES[m].lo,MODES[m].hi,cur[m],"Kategorie "+MODES[m].n).replace('class="card"',i===0&&MODES[f]?'class="card focus"':'class="card"')).join("")}

      <input id="trigtxt" maxlength="60" placeholder="Oder selbst eintragen, z. B. Anruf von zu Hause" style="margin-top:10px">

  hilfe(){ const t=cur.tier; let h=tierHead(t);

  fuermich(){ const seg=`<div class="seg">${[["protokoll","Protokoll"],["liste","Meine Liste"],["wirkung","Was hilft"],["wann","Wann"]].map(([k,l])=>`<button class="${cur.fm===k?"on":""}" data-fm="${k}">${l}</button>`).join("")}</div>`;

const DAY=864e5;
function rangeStart(r){ const d=new Date(); d.setHours(0,0,0,0); return d.getTime()-(r-1)*DAY; }
const inRange=r=>S.points.filter(p=>p.t>=rangeStart(r));

  const f=m=>ps.filter(p=>val(p,m)!=null).map(p=>[val(p,m),p.t]); const [amax,amaxT]=top(f("a")), [svmax,svmaxT]=top(f("sv")), [suimax,suimaxT]=top(f("sui"));

  return {amax,amaxT,svmax,svmaxT,suimax,suimaxT,high:ps.filter(p=>p.ctx==="check"&&Object.keys(MODES).some(m=>val(p,m)!=null&&tierOf(m,val(p,m))==="hoch")).length,skills:n.length,ok:n.filter(p=>p.helped!=="nein").length}; }

function groupBy(ps,kind){ const m=new Map();

function chart(r,ps){
  const W=360,H=210,L=24,R=8,T=14,B=26, from=rangeStart(r), to=from+r*DAY;

  let g=""; [0,5,10].forEach(v=>g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2f3540"/><text x="${L-6}" y="${Y(v)+4}" fill="#9aa3b2" font-size="12" text-anchor="end">${v}</text>`);
  g+=`<line x1="${L}" x2="${W-R}" y1="${Y(7)}" y2="${Y(7)}" stroke="#d0706a" stroke-dasharray="4 4" opacity=".55"/><text x="${W-R}" y="${Y(7)-4}" fill="#d0706a" font-size="12" text-anchor="end">Hochspannung</text>`;

  if(r===1) [6,12,18].forEach(h=>tick(from+h*3600e3,h+" Uhr"));
  else if(r<=7) for(let i=0;i<r;i++) tick(from+i*DAY+DAY/2,new Date(from+i*DAY).toLocaleDateString("de-DE",{weekday:"short"}));
  else if(r===30) for(let i=2;i<30;i+=7) tick(from+i*DAY,dstr(from+i*DAY));

}
function exportText(r){ const ps=inRange(r), st=stats(ps), L=[], m=(v,t)=>v==null?"–":v+(t?" ("+fmtShort(t)+")":"");
  L.push(`Spannungsprotokoll – ${nameOf()} – ${periodLabel(r)}`,"","Höchstwerte:",`  Anspannung ${m(st.amax,st.amaxT)}`,`  Selbstverletzungsdruck ${m(st.svmax,st.svmaxT)}`,`  Suizidgedanken ${m(st.suimax,st.suimaxT)}`,"");
  const tc=trigCounts(ps); if(tc.length) L.push("Häufigste Auslöser: "+tc.slice(0,5).map(o=>trigLabel(o.t)+" ("+o.n+"×)").join(", "),"");
  groupBy(ps,"day").forEach(g=>{ const s2=stats(g.ps); L.push(`${g.lab}: Anspannung max ${s2.amax==null?"–":s2.amax}, Druck max ${s2.svmax==null?"–":s2.svmax}, Suizidgedanken max ${s2.suimax==null?"–":s2.suimax}`);
    g.ps.slice().reverse().forEach(p=>L.push(`   ${new Date(p.t).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})}  ${valsText(p)}${p.prob&&p.prob.length?", Probleme: "+p.prob.join(", "):""}${p.trig?", Auslöser: "+trigLabel(p.trig):""}${p.ctx==="nach"?", nach "+p.skill+" (geholfen: "+HELP[p.helped].l+")":""}`)); });
  return L.join("\n"); }

/* ===== Steuerung ===== */
let view="start", skillFrom="start";
const OUT=["welcome","register","login","sosAge","sos","how","code","reset","datenschutz","stats","admin"];
const NAVMAP={start:"start",check:"start",rate:"start",hilfe:"start",eval:"start",rate2:"start",ergebnis:"start",skills:"skills",fuermich:"fuermich",plan:"plan",profil:"profil",triggers:"profil"};
let HIST=[];
const ROOTS=["start","skills","fuermich","plan","profil","welcome"];
function go(v,keep,back){ stopTimer(); if(!back&&!keep&&view!==v) HIST.push(view); if(v==="ergebnis") HIST=["start"]; if(v==="start"||v==="welcome") HIST=[];
  view=v; const showBack=HIST.length&&!(ROOTS.includes(v)&&!["fuermich","plan"].includes(v)&&HIST.length===0);
  $("#app").innerHTML=(HIST.length&&v!=="start"&&v!=="welcome"?`<button class="back" id="back">‹ Zurück</button>`:"")+V[v](); if(!keep) window.scrollTo(0,0);
  document.body.classList.toggle("out",OUT.includes(v)||(v==="skill"&&cur.sos)||(v==="triggers"&&cur.trigFrom!=="profil"));
  const nv=v==="skill"?skillFrom:NAVMAP[v]; document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===nv)); bind(); }

  if($("#sos")) $("#sos").onclick=()=>{ cur.sos=true; cur.off=0; go("sosAge"); };
  if($("#more")) $("#more").onclick=()=>{ cur.off++; go(view,true); };
  if($("#test")) $("#test").onclick=()=>{ S=fresh(); S.account={name:"Testperson",age:35,test:true,triggers:["abend","allein","streit","kritik"],ownTriggers:""}; S.loggedIn=true; S.onboarded=true; S.points=demo(); S.plan.reasons="Meine Familie\nDas Konzert im Sommer"; { const days=[...new Set(S.points.map(p=>dayKey(p.t)))].filter(k=>k!==dayKey(Date.now())); S.rewards={points:days.length,days,today:{}}; } save(); cur.sos=false; go("start"); };

  if(view==="register"){ cur.regG=null; document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{ cur.regG=b.dataset.g; document.querySelectorAll("[data-g]").forEach(z=>z.classList.toggle("on",z===b)); }); }

  if($("#statsset")) $("#statsset").onclick=()=>{ cur.statsNext="profil"; go("stats"); };
  if(view==="admin"){ const run=async()=>{ const k=$("#ak").value.trim().toUpperCase(); if(!k) return err("Bitte gib den Team-Schlüssel ein."); $("#akok").disabled=true; err("Wird geladen …");

  if(view==="register") $("#reg").onclick=async()=>{
    const n=$("#r-name").value.trim(), age=ageOk($("#r-age").value), m=$("#r-mail").value.trim().toLowerCase(), p=$("#r-pw").value, p2=$("#r-pw2").value;
    if(!n) return err("Bitte gib einen Namen ein."); if(age==null) return err("Bitte gib dein Alter ein.");
    if(!cur.regG) return err("Bitte wähle eine Angabe zum Geschlecht.");
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)) return err("Bitte gib eine gültige E-Mail-Adresse ein.");
    if(p.length<6) return err("Das Passwort braucht mindestens 6 Zeichen."); if(p!==p2) return err("Die Passwörter stimmen nicht überein.");
    const salt=randSalt(); S=fresh(); S.account={name:n,age,email:m,gender:cur.regG,salt,hash:await hash(p,salt),triggers:[],ownTriggers:""}; S.loggedIn=true; await newRecovery(); save(); cur.sos=false; cur.trigFrom="how"; cur.codeNext=age>=16?"stats":"triggers"; cur.statsNext="triggers"; HIST=[]; go("code",false,true); };
  if(view==="triggers"){ document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{ const t=S.account.triggers=S.account.triggers||[], k=b.dataset.t, i=t.indexOf(k); i<0?t.push(k):t.splice(i,1); b.classList.toggle("on"); save(); });

  const askWipe=()=>confirmBox("Wirklich alles löschen?","Konto, Notfallplan und Protokoll sind danach weg.","Ja, alles löschen",wipe);
  if($("#resetwipe")) $("#resetwipe").onclick=askWipe; if($("#resetwipe2")) $("#resetwipe2").onclick=askWipe;
  if(view==="code"){ $("#codeok").onchange=e=>{ $("#codedone").disabled=!e.target.checked; }; $("#codedone").onclick=()=>{ cur.newCode=null; const n=cur.codeNext||"start"; cur.codeNext=null; HIST=[]; go(n,false,true); }; }
  if(view==="reset"&&$("#rcok")){ const doReset=async()=>{ const a=S.account, rl=S.rl||{n:0,until:0};
      if(Date.now()<rl.until) return err(`Zu viele Versuche. Bitte warte ${Math.ceil((rl.until-Date.now())/1000)} Sekunden.`);
      const c=normCode($("#rc").value), p=$("#np").value, p2=$("#np2").value;
      if(c.length!==12) return err("Der Code hat 12 Zeichen."); if(p.length<6) return err("Das Passwort braucht mindestens 6 Zeichen."); if(p!==p2) return err("Die Passwörter stimmen nicht überein.");
      if(await hash(c,a.rsalt)!==a.rhash){ rl.n++; if(rl.n>=5){ rl.until=Date.now()+60000; rl.n=0; } S.rl=rl; save(); return err("Der Code stimmt nicht."); }
      S.rl=null; a.salt=randSalt(); a.hash=await hash(p,a.salt); S.loggedIn=true; cur.sos=false; await newRecovery(); save(); toast("Neues Passwort gespeichert");
      cur.codeNext=S.onboarded?"start":"how"; HIST=[]; go("code",false,true); };
    $("#rcok").onclick=doReset; $("#np2").onkeydown=e=>{ if(e.key==="Enter") doReset(); }; }
  if($("#newcode")) $("#newcode").onclick=()=>confirmBox("Neuen Code erstellen?","Der alte Wiederherstellungscode gilt danach nicht mehr.","Ja, neuen Code",async()=>{ await newRecovery(); save(); cur.codeNext="profil"; HIST=[]; go("code",false,true); });
  if(view==="how") $("#howdone").onclick=()=>{ S.onboarded=true; save(); go("start"); };
  if(view==="start") document.querySelectorAll(".area").forEach(b=>b.onclick=()=>{ cur.openCat=[b.dataset.area]; cur.openTier=[b.dataset.area+"hoch"]; cur.q=""; go("skills"); });
  if(view==="check"){ cur.lastCheck=null; } if(view==="check") document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{ cur.focus=b.dataset.mode; cur.a=cur.sv=cur.sui=null; cur.prob=[]; cur.trig=null; go("rate"); });
  if(view==="rate"){ bindTicks(()=>{ $("#go").disabled=!allSet(); });
    document.querySelectorAll("[data-prob]").forEach(b=>b.onclick=()=>{ const t=b.dataset.prob, i=cur.prob.findIndex(x=>x.toLowerCase()===t.toLowerCase()); i<0?cur.prob.push(t):cur.prob.splice(i,1); b.classList.toggle("on"); });
    document.querySelectorAll("[data-trig]").forEach(b=>b.onclick=()=>{ const k=b.dataset.trig; cur.trig=cur.trig===k?null:k; $("#trigtxt").value=""; document.querySelectorAll("[data-trig]").forEach(z=>z.classList.toggle("on",z.dataset.trig===cur.trig)); });
    $("#trigtxt").oninput=e=>{ const t=normTrig(e.target.value); cur.trig=t||null; document.querySelectorAll("[data-trig]").forEach(z=>z.classList.toggle("on",!!t&&trigKey(z.dataset.trig)===trigKey(t))); };
    $("#go").onclick=()=>{ if(cur.trig) cur.trig=TRIGGERS[cur.trig]?cur.trig:normTrig(cur.trig);
      const pt=normTrig($("#probtxt").value); if(pt&&!cur.prob.some(x=>x.toLowerCase()===pt.toLowerCase())) cur.prob.push(pt);
      const all={a:cur.a,sv:cur.sv,sui:cur.sui}; cur.vals=all;
      cur.mode=MODES[cur.focus]?cur.focus:Object.keys(MODES).sort((x,y)=>(RK[tierOf(y,all[y])]*20+all[y])-(RK[tierOf(x,all[x])]*20+all[x]))[0];
      cur.v=all[cur.mode]; cur.tier=["hoch","mittel","niedrig"].find(t=>Object.keys(all).some(m=>tierOf(m,all[m])===t)); cur.off=0; cur.tried=[]; cur.before={v:cur.v};
      const pt0={t:Date.now(),mode:cur.mode,v:cur.v,all,ctx:"check",trig:cur.trig,prob:cur.prob.length?cur.prob.slice():undefined};
      if(cur.lastCheck&&S.points[0]&&S.points[0].t===cur.lastCheck) S.points[0]=pt0; else S.points.unshift(pt0); cur.lastCheck=pt0.t; save(); go("hilfe"); }; }
  if(view==="skills"){ document.querySelectorAll("[data-oc]").forEach(b=>b.onclick=()=>{ const k=b.dataset.oc, i=cur.openCat.indexOf(k); i<0?cur.openCat.push(k):cur.openCat.splice(i,1); go("skills",true); });
    document.querySelectorAll("[data-ot]").forEach(b=>b.onclick=()=>{ const k=b.dataset.ot, i=cur.openTier.indexOf(k); i<0?cur.openTier.push(k):cur.openTier.splice(i,1); go("skills",true); });
    const q=$("#q"); q.oninput=()=>{ cur.q=q.value; const pos=q.selectionStart; go("skills",true); const n=$("#q"); n.focus(); n.setSelectionRange(pos,pos); }; }
  if(view==="fuermich"){ document.querySelectorAll("[data-fm]").forEach(b=>b.onclick=()=>{ cur.fm=b.dataset.fm; go("fuermich",true); });
    document.querySelectorAll("[data-rng]").forEach(b=>b.onclick=()=>{ cur.range=+b.dataset.rng; cur.open=[]; go("fuermich",true); });
    document.querySelectorAll("[data-open]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); const k=b.dataset.open, i=cur.open.indexOf(k); i<0?cur.open.push(k):cur.open.splice(i,1); go("fuermich",true); });
    document.querySelectorAll("[data-more]").forEach(b=>b.onclick=()=>{ const k=b.dataset.more, i=cur.more.indexOf(k); i<0?cur.more.push(k):cur.more.splice(i,1); go("fuermich",true); });
    if($("#dl")) $("#dl").onclick=async()=>{ const fn=`Meine Skill-Liste ${S.account.name}.html`, html=printHTML();
      if(window.CalmiusAndroid){ CalmiusAndroid.print(html,fn); return; }
      if(window.claude&&claude.use){ try{ const d=await claude.use("downloads"); if(!d) throw {code:"unavailable"}; await d.save({filename:fn,data:html}); toast("Gespeichert – Datei öffnen zum Drucken"); return; }
        catch(e){ if(e&&e.code==="declined") return; } }
      try{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([html],{type:"text/html"})); a.download=fn; document.body.appendChild(a); a.click(); a.remove(); toast("Gespeichert – Datei öffnen zum Drucken"); }
      catch(e){ toast("Herunterladen nicht möglich – bitte kopieren"); } };
    if($("#cplist")) $("#cplist").onclick=()=>{ const L=myList(), out=["Meine Skill-Liste – "+nameOf()+" – Stand "+new Date().toLocaleDateString("de-DE")];
      ["hoch","mittel","niedrig"].forEach(t=>{ out.push("",TIERS[t].label+" ("+TIERS[t].range+")"); L[t].forEach(o=>out.push(`  ${o.good?"✓":"✗"} ${o.s.t} (${AREAS[o.s.area].label}) – ${o.n}× genutzt, ${o.ja+o.etwas}× geholfen`)); });
      try{ navigator.clipboard.writeText(out.join("\n")).then(()=>toast("Kopiert"),()=>toast("Kopieren nicht möglich")); }catch(e){ toast("Kopieren nicht möglich"); } };
    if($("#copy")) $("#copy").onclick=()=>{ const txt=exportText(cur.range);
      try{ navigator.clipboard.writeText(txt).then(()=>toast("Kopiert"),()=>toast("Kopieren nicht möglich")); }catch(e){ toast("Kopieren nicht möglich"); } }; }
  if(view==="skill"){ $("#start").onclick=startTimer; $("#done").onclick=()=>{ if(cur.sos) return go("sos"); go("eval"); }; }
  if(view==="eval") document.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{ cur.helped=b.dataset.h; cur.v=cur.before?cur.before.v:null; go("rate2"); });
  if(view==="rate2"){ bindTicks(()=>{ $("#saveAfter").disabled=!ready(); }); document.querySelectorAll("[data-m2]").forEach(b=>b.onclick=()=>{ cur.mode=b.dataset.m2; go("rate2",true); });
    $("#saveAfter").onclick=()=>{ const b=cur.before||{v:null};

  if(view==="plan") [["warn","p-warn"],["skills","p-skills"],["people","p-people"],["reasons","p-reasons"]].forEach(([k,id])=>{ $("#"+id).oninput=e=>{ S.plan[k]=e.target.value; save(); }; });

    $("#spsave").onclick=()=>{ const u=$("#sp").value.trim(); if(u&&!validSpotify(u)){ $("#sperr").textContent="Bitte einen Spotify-Link einfügen (beginnt mit https://open.spotify.com/)."; return; } S.spotify=u; save(); toast(u?"Playlist verbunden":"Spotify getrennt"); go("profil"); };
    $("#intro").onclick=()=>go("how");
    if($("#logout")) $("#logout").onclick=()=>{ S.loggedIn=false; save(); go("welcome"); };

}
function startTimer(){ stopTimer(); let left=cur.skill.min*60,phase=0,pt=0; const tm=$("#tm"),br=$("#br"); $("#start").textContent="Läuft …";
  const tick=()=>{ tm.textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
    if(br){ const len=phase===0?4:6; if(pt===0){ br.textContent=phase===0?"ein":"aus"; br.style.transitionDuration=len+"s"; br.style.transform=phase===0?"scale(1.3)":"scale(0.85)"; } pt++; if(pt>=len){ pt=0; phase=1-phase; } }
    if(left<=0){ stopTimer(); tm.textContent="Geschafft"; $("#start").textContent="Nochmal"; if(!cur.sos) setTimeout(()=>{ if(view==="skill") go("eval"); },1200); return; } left--; };
  tick(); timerId=setInterval(tick,1000); }
function confirmBox(title,text,yes,fn){ const o=document.createElement("div"); o.className="overlay";
  o.innerHTML=`<div class="card"><h2 style="margin-top:0">${title}</h2><p>${text}</p><button class="btn red" id="y">${yes}</button><button class="btn sec" id="n">Abbrechen</button></div>`;
  document.body.appendChild(o); o.querySelector("#n").onclick=()=>o.remove(); o.querySelector("#y").onclick=()=>{ o.remove(); fn(); }; }
function wipe(){ try{localStorage.removeItem(KEY);}catch(e){} mem=null; S=load(); cur.v=null; cur.sos=false; toast("Alles gelöscht"); go("welcome"); }
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{ cur.sos=false; HIST=[]; go(b.dataset.v,false,true); });
if("serviceWorker" in navigator&&location.protocol==="https:"&&!/claude\.ai|claudeusercontent/.test(location.host)){ try{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){} }
if(location.hash==="#team"){ go("admin"); } else if(S.account&&S.loggedIn&&S.onboarded&&!S.stats&&!S.account.test&&+S.account.age>=16){ cur.statsNext="start"; go("stats"); } else go(S.account&&S.loggedIn?(S.onboarded?"start":"how"):"welcome"); setTimeout(statsVisit,800);
</script>
